<style>
  :root{--bg:#eef1f5;--paper:#fff;--ink:#1d2330;--muted:#6b7385;--line:#dfe3ea;--accent:#1f4e79;--soft:#e8f0f8;--green:#1e6b3a;--greenbg:#e3f4ea;--red:#8c1d18;--redbg:#fde2e1}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI",Roboto,Arial,sans-serif}
  .bar{position:sticky;top:0;z-index:5;background:var(--accent);color:#fff;padding:10px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .bar h1{font-size:16px;margin:0 auto 0 0;font-weight:600}
  .bar select,.bar button{border-radius:6px;padding:7px 12px;font:inherit;font-weight:600;cursor:pointer;border:1px solid rgba(255,255,255,.6)}
  .bar select{background:#fff;color:var(--accent);border:0}
  .bar button{background:transparent;color:#fff}
  .bar button.pri{background:#fff;color:var(--accent);border-color:#fff}
  .paper{max-width:1100px;margin:20px auto;background:var(--paper);padding:32px;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
  .head{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;border-bottom:3px solid var(--accent);padding-bottom:16px;margin-bottom:18px}
  .head h2{margin:0;font-size:30px;letter-spacing:2px;color:var(--accent)}
  .meta{display:flex;gap:22px;flex-wrap:wrap;margin-top:6px}
  .meta div span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
  .meta div b{font-size:15px}
  .period{background:var(--soft);border-radius:10px;padding:12px 16px;min-width:240px}
  .period span{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
  .period b{display:block;font-size:18px;color:var(--accent)}
  .parties{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
  .box{background:var(--soft);border-radius:10px;padding:14px 16px}
  .box h3{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--accent)}
  .box p{margin:0;white-space:pre-wrap}
  .paystat{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-radius:10px;padding:14px 18px;margin-bottom:18px;font-weight:600}
  .paystat.pend{background:var(--redbg);color:var(--red)}
  .paystat.paid{background:var(--greenbg);color:var(--green)}
  .paystat.sched{background:var(--soft);color:var(--accent)}
  .paystat small{display:block;font-weight:400;opacity:.85}
  .paystat button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}
  .wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse}
  th{background:var(--accent);color:#fff;font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:8px 6px;text-align:left;white-space:nowrap}
  td{border-bottom:1px solid var(--line);padding:7px 6px;vertical-align:middle}
  td.r,th.r{text-align:right}
  td.b{font-weight:700;white-space:nowrap}
  .flags{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
  .flag{width:22px;height:15px;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.18)}
  .sum{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;margin-top:22px;align-items:start}
  .sum h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--accent)}
  .tot td{padding:9px 10px}
  .tot tr.g td{background:var(--accent);color:#fff;font-size:18px;font-weight:700}
  .notes{margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .notes .box{background:#fff;border:1px solid var(--line)}
  .center{text-align:center;padding:80px 20px;color:var(--muted)}
  .foot{max-width:1100px;margin:0 auto 30px;color:var(--muted);font-size:12px;text-align:center}
  /* janela */
  .bg{position:fixed;inset:0;background:rgba(16,24,40,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
  .bg.open{display:flex}
  .modal{background:#fff;border-radius:14px;max-width:460px;width:100%;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .mt{background:var(--accent);color:#fff;padding:18px 22px;font-size:18px;font-weight:700}
  .mb{padding:18px 22px}
  .mb label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:10px 0 3px}
  .mb input,.mb textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:16px}
  .opts{display:flex;gap:8px}
  .opts label{flex:1;border:2px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;text-transform:none;font-size:15px;color:var(--ink);letter-spacing:0;margin:0;display:flex;gap:8px;align-items:center}
  .opts label:has(input:checked){border-color:var(--accent);background:var(--soft)}
  .opts input{width:auto}
  .ma{display:flex;justify-content:flex-end;gap:8px;padding:0 22px 18px}
  .ma button{border-radius:8px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--line);background:#fff}
  .ma button.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1e6b3a;color:#fff;padding:10px 16px;border-radius:8px;font-weight:600;display:none;z-index:60;max-width:92vw}

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script>
const $ = id => document.getElementById(id);
const fmt = v => (+v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fd = v => { if(!v) return "—"; const [y,m,d] = v.split("-"); return `${d}/${m}/${y}`; };
const today = ()=>{ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const FLAGS = {
  br:`<svg class="flag" viewBox="0 0 30 21"><rect width="30" height="21" fill="#009c3b"/><path d="M15 2.5 27.5 10.5 15 18.5 2.5 10.5z" fill="#ffdf00"/><circle cx="15" cy="10.5" r="5" fill="#002776"/></svg>`,
  us:`<svg class="flag" viewBox="0 0 30 21"><rect width="30" height="21" fill="#fff"/>${[0,2,4,6,8,10,12].map(i=>`<rect y="${i*21/13}" width="30" height="${21/13}" fill="#b22234"/>`).join("")}<rect width="12.5" height="${21*7/13}" fill="#3c3b6e"/></svg>`,
  es:`<svg class="flag" viewBox="0 0 30 21"><rect width="30" height="21" fill="#aa151b"/><rect y="5.25" width="30" height="10.5" fill="#f1bf00"/></svg>`
};
function flags(v){
  if(!v) return "—";
  return `<span class="flags" title="${esc(v)}">` + v.split("/").map(n=>{
    const k = n.trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
    return k.startsWith("portugu") ? FLAGS.br : k.startsWith("ingl") ? FLAGS.us : k.startsWith("espanh") ? FLAGS.es : esc(n.trim());
  }).join("/") + `</span>`;
}

const ID = location.hash.slice(1).trim();
const LOCAL = "rel_pag_" + ID;
let R = null, cur = null;
function localPays(){ try{ return JSON.parse(localStorage.getItem(LOCAL)) || {}; }catch(e){ return {}; } }

async function load(){
  if(!/^[0-9a-f]{20,40}$/i.test(ID)){ $("app").innerHTML = `<div class="center">Link incompleto. Peça o link do relatório novamente.</div>`; return; }
  try{
    const g = await (await fetch(`https://api.github.com/gists/${ID}?_=${Date.now()}`, {cache:"no-store"})).json();
    const f = g.files && g.files["relatorio-traducoes.json"];
    if(!f) throw new Error("sem arquivo");
    R = JSON.parse(f.truncated ? await (await fetch(f.raw_url)).text() : f.content);
  }catch(e){ $("app").innerHTML = `<div class="center">Não foi possível carregar o relatório agora. Tente de novo em alguns minutos.</div>`; return; }
  const sel = $("sel");
  sel.innerHTML = R.invoices.map((iv,i)=>`<option value="${i}">${esc(iv.label)}${iv.invNumber ? " · Invoice "+esc(iv.invNumber) : ""}</option>`).join("");
  sel.style.display = R.invoices.length > 1 ? "" : "none";
  const want = cur ? cur.key : new URLSearchParams(location.search).get("mes");
  const idx = Math.max(0, R.invoices.findIndex(iv=> iv.key === want));
  sel.value = idx; sel.onchange = ()=> show(+sel.value);
  $("foot").textContent = `Atualizado em ${new Date(R.updatedAt).toLocaleString("pt-BR")}`;
  show(idx);
}

function show(i){
  cur = R.invoices[i];
  const iv = cur, by = {};
  iv.rows.forEach(r=>{ const n = r.cliente || "(sem nome)"; by[n] = by[n] || {d:0,p:0,v:0}; by[n].d++; by[n].p += r.paginas; by[n].v += r.total; });
  const p = (R.payments||{})[iv.key] || localPays()[iv.key];
  const ps = !p ? `<div class="paystat pend"><div>⏳ Aguardando pagamento · ${fmt(iv.total)}<small>Já pagou ou tem data para pagar? Avise com um clique.</small></div><button id="bPay">Confirmar pagamento</button></div>`
    : p.status === "paid" ? `<div class="paystat paid"><div>✓ Pagamento confirmado em ${fd(p.date)}<small>${p.pending ? "Confirmação enviada ao tradutor." : ""}${p.note ? " " + esc(p.note) : ""}</small></div><button id="bPay">Alterar</button></div>`
    : `<div class="paystat sched"><div>🗓 Pagamento previsto para ${fd(p.date)}<small>${p.pending ? "Previsão enviada ao tradutor." : ""}${p.note ? " " + esc(p.note) : ""}</small></div><button id="bPay">Alterar / já paguei</button></div>`;
  $("app").innerHTML = `
    <div class="head">
      <div><h2>INVOICE</h2>
        <div class="meta"><div><span>Nº do invoice</span><b>${esc(iv.invNumber || "—")}</b></div><div><span>Emissão</span><b>${fd(iv.invDate)}</b></div><div><span>Documentos</span><b>${iv.docs}</b></div><div><span>Páginas</span><b>${iv.pages}</b></div></div>
      </div>
      <div class="period"><span>Período de referência</span><b>${esc(iv.label)}</b>${esc(iv.period)}</div>
    </div>
    ${ps}
    <div class="parties">
      <div class="box"><h3>Prestador (tradutor)</h3><p><b>${esc(R.from.name)}</b>\n${esc([R.from.doc, R.from.contact].filter(Boolean).join(" · "))}</p></div>
      <div class="box"><h3>Faturar para</h3><p><b>${esc(R.to.name)}</b>\n${esc([R.to.doc, R.to.contact].filter(Boolean).join(" · "))}</p></div>
    </div>
    <div class="wrap"><table class="items">
      <thead><tr><th>#</th><th>Cliente</th><th>Idioma</th><th>Tipo de tradução</th><th class="r">Págs.</th><th class="r">Valor/pág.</th><th>Solicitação</th><th>Prazo</th><th>Entregue</th><th class="r">Valor</th></tr></thead>
      <tbody>${iv.rows.map((r,k)=>`<tr><td>${k+1}</td><td>${esc(r.cliente)}</td><td>${flags(r.idioma)}</td><td>${esc(r.tipo)}</td><td class="r">${r.paginas}</td><td class="r">${fmt(r.valor)}</td><td>${fd(r.solicitacao)}</td><td>${fd(r.prazo)}</td><td>${fd(r.entregue)}</td><td class="r b">${fmt(r.total)}</td></tr>`).join("")}</tbody>
    </table></div>
    <div class="sum">
      <div><h3>Total por cliente</h3><table><thead><tr><th>Cliente</th><th class="r">Docs</th><th class="r">Págs.</th><th class="r">Valor</th></tr></thead>
        <tbody>${Object.keys(by).sort((a,b)=>a.localeCompare(b,"pt-BR")).map(n=>`<tr><td>${esc(n)}</td><td class="r">${by[n].d}</td><td class="r">${by[n].p}</td><td class="r b">${fmt(by[n].v)}</td></tr>`).join("")}</tbody></table></div>
      <div><h3>Resumo</h3><table class="tot"><tr><td>Documentos</td><td class="r b">${iv.docs}</td></tr><tr><td>Total de páginas</td><td class="r b">${iv.pages}</td></tr><tr class="g"><td>TOTAL A PAGAR</td><td class="r">${fmt(iv.total)}</td></tr></table></div>
    </div>
    <div class="notes">
      ${R.payInfo ? `<div class="box"><h3>Dados para pagamento</h3><p>${esc(R.payInfo)}</p></div>` : ""}
      ${iv.notes ? `<div class="box"><h3>Observações</h3><p>${esc(iv.notes)}</p></div>` : ""}
    </div>`;
  $("bPay").onclick = openPay;
  document.title = `Invoice ${iv.invNumber || ""} – ${iv.label} – Ricardo Saes`;
}

function openPay(){
  const p = (R.payments||{})[cur.key] || localPays()[cur.key];
  document.querySelector(`input[name=st][value=${p && p.status==="scheduled" ? "scheduled" : "paid"}]`).checked = true;
  $("pDate").value = (p && p.status==="scheduled" && p.date) || today();
  $("mTitle").textContent = `Pagamento · ${cur.label} · ${fmt(cur.total)}`;
  syncLbl(); $("bg").classList.add("open");
}
function syncLbl(){ $("dLbl").textContent = document.querySelector("input[name=st]:checked").value === "paid" ? "Data do pagamento" : "Pagarei em"; }
document.querySelectorAll("input[name=st]").forEach(r=> r.onchange = syncLbl);
$("mCancel").onclick = ()=> $("bg").classList.remove("open");
$("mSend").onclick = async ()=>{
  const st = document.querySelector("input[name=st]:checked").value, d = $("pDate").value;
  if(!d){ $("pDate").focus(); return; }
  const name = $("pName").value.trim(), note = $("pNote").value.trim();
  const title = st === "paid" ? `💰 Pagamento confirmado – ${cur.label}` : `🗓 Pagamento previsto – ${cur.label}`;
  const msg = [ `Invoice ${cur.invNumber || "—"} · ${cur.label} · ${fmt(cur.total)}`,
    st === "paid" ? `Pago em ${fd(d)}` : `Vai pagar em ${fd(d)}`,
    name ? `Nome: ${name}` : "", note ? `Obs: ${note}` : "",
    `ref:${cur.key}|${st}|${d}` ].filter(Boolean).join("\n");
  const btn = $("mSend"); btn.disabled = true; btn.textContent = "Enviando…";
  try{
    const r = await fetch("https://ntfy.sh/", {method:"POST", body:JSON.stringify({topic:R.notify, title, message:msg, tags:[st==="paid"?"moneybag":"calendar"], priority:4, click:location.href})});
    if(!r.ok) throw new Error(r.status);
    const lp = localPays(); lp[cur.key] = {status:st, date:d, note, pending:true}; try{ localStorage.setItem(LOCAL, JSON.stringify(lp)); }catch(e){}
    if(R.payments) delete R.payments[cur.key];
    $("bg").classList.remove("open"); toast("Obrigado! O tradutor foi avisado."); show(+$("sel").value || 0);
  }catch(e){ toast("Não consegui enviar agora. Verifique a internet e tente de novo.", true); }
  btn.disabled = false; btn.textContent = "Enviar confirmação";
};
function toast(t, err){ const el = $("toast"); el.textContent = t; el.style.background = err ? "#b3261e" : "#1e6b3a"; el.style.display = "block"; clearTimeout(el._t); el._t = setTimeout(()=> el.style.display = "none", 5000); }

$("bPdf").onclick = ()=> window.print();
$("bXls").onclick = ()=>{
  if(!window.XLSX){ toast("Carregando o gerador de Excel… tente de novo em 2 segundos.", true); return; }
  const iv = cur, wb = XLSX.utils.book_new();
  const head = [["Invoice", iv.invNumber || ""],["Período", iv.label + " (" + iv.period + ")"],["Prestador", R.from.name],["Faturar para", R.to.name],[],
    ["#","Cliente","Idioma","Tipo de tradução","Páginas","Valor/página","Solicitação","Prazo","Entregue","Valor final"]];
  const rows = iv.rows.map((r,k)=>[k+1, r.cliente, r.idioma, r.tipo, r.paginas, r.valor, fd(r.solicitacao), fd(r.prazo), fd(r.entregue), r.total]);
  const ws = XLSX.utils.aoa_to_sheet([...head, ...rows, [], ["","","","Total", iv.pages, "", "", "", "", iv.total]]);
  ws["!cols"] = [{wch:4},{wch:28},{wch:18},{wch:30},{wch:9},{wch:12},{wch:12},{wch:12},{wch:12},{wch:13}];
  for(let r = head.length; r < head.length + rows.length + 2; r++) ["F","J"].forEach(c=>{ const cell = ws[c + (r+1)]; if(cell && typeof cell.v === "number") cell.z = '"R$" #,##0.00'; });
  XLSX.utils.book_append_sheet(wb, ws, "Invoice");
  const by = {}; iv.rows.forEach(r=>{ const n = r.cliente||"(sem nome)"; by[n] = by[n] || [n,0,0,0]; by[n][1]++; by[n][2]+=r.paginas; by[n][3]+=r.total; });
  const ws2 = XLSX.utils.aoa_to_sheet([["Cliente","Documentos","Páginas","Valor"], ...Object.values(by), ["Total", iv.docs, iv.pages, iv.total]]);
  ws2["!cols"] = [{wch:30},{wch:12},{wch:10},{wch:14}];
  Object.keys(ws2).forEach(k=>{ if(/^D\d+$/.test(k) && typeof ws2[k].v === "number") ws2[k].z = '"R$" #,##0.00'; });
  XLSX.utils.book_append_sheet(wb, ws2, "Por cliente");
  XLSX.writeFile(wb, `Invoice_${iv.invNumber || ""}_${iv.label.replace("/","_")}_Ricardo_Saes.xlsx`);
};
load();
setInterval(()=>{ if(!document.hidden && R) load(); }, 120000);
</script>
</body>
</html>
